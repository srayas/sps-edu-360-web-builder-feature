version: '3'

services:
  # Elasticsearch Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.1
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme  # Set a password for the elastic user
      - ES_JAVA_OPTS=-Xms2g -Xmx2g  # Set Java heap size (adjust as necessary)
      - xpack.security.enabled=true  # Enable security in Elasticsearch
      - xpack.security.authc.apiKey.enabled=true  # Optional: Enable API Key authentication
    networks:
      - elastic-network
    ports:
      - "9200:9200"  # Expose port 9200 for Elasticsearch
      - "9300:9300"  # Expose port 9300 for Elasticsearch communication
    volumes:
      - esdata:/usr/share/elasticsearch/data  # Persistent storage for Elasticsearch data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      retries: 5
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # Kibana Service
  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_PASSWORD=kibana_admin  # The password you set for Elasticsearch
      - ELASTICSEARCH_USERNAME=kibana_admin  # Username to connect with Elasticsearch
      - SERVER_NAME=kibana.local
      - SERVER_HOST=0.0.0.0  # Bind to all interfaces
    networks:
      - elastic-network
    ports:
      - "5601:5601"  # Expose port 5601 for Kibana
    depends_on:
      - elasticsearch  # Make sure Elasticsearch is up before Kibana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601"]
      interval: 10s
      retries: 5
    restart: always

networks:
  elastic-network:
    driver: bridge

volumes:
  esdata:
    driver: local