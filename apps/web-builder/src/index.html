<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>spsEdu360 Web Builder</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build and publish themed web applications with Angular Material.">
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
</head>
<body>
  <app-root>
    <!-- Replaced when the app boots; styled by the global theme so there is no blank screen. -->
    <div class="ui-boot" aria-busy="true" aria-label="Loading">
      <div class="ui-boot-side">
        <span class="ui-sk ui-sk-title"></span>
        <span class="ui-sk ui-sk-line"></span>
        <span class="ui-sk ui-sk-line"></span>
      </div>
      <div class="ui-boot-main">
        <span class="ui-sk ui-boot-hero"></span>
        <div class="ui-boot-cards"><span class="ui-sk ui-boot-card"></span><span class="ui-sk ui-boot-card"></span><span class="ui-sk ui-boot-card"></span></div>
      </div>
    </div>
  </app-root>
</body>
</html>
